<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>班級經營主控台</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="app-icon.png">

  <meta name="theme-color" content="#f7f6ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="班級主控台">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff8fb 0%,
          #f7f8ff 50%,
          #f5f1ff 100%
        );

      color: #2f3e55;
      min-height: 100vh;
    }


    body.auth-checking {
      visibility: hidden;
    }


    .page {
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
      padding: 14px 20px 20px;
    }


    /* =========================
       上方標題區
       ========================= */

    .hero {
      position: relative;

      background:
        rgba(255, 255, 255, 0.86);

      border-radius: 30px;

      min-height: 190px;

      padding: 46px 24px 32px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(79, 70, 120, 0.07);

      margin-bottom: 34px;
    }


    /* 登入帳號區 */

    .account-area {
      position: absolute;

      top: 18px;
      right: 22px;

      display: flex;
      align-items: center;
      gap: 8px;
    }


    .account-box {
      padding: 8px 12px;

      border-radius: 10px;

      background: #f8fafc;

      border: 1px solid #d8dee9;

      color: #64748b;

      font-size: 13px;
      font-weight: 700;

      white-space: nowrap;
    }


    .logout-btn {
      border: 1px solid #ffc7d6;

      background: #fff1f5;

      color: #be123c;

      border-radius: 10px;

      padding: 8px 12px;

      cursor: pointer;

      font-size: 13px;

      font-weight: 800;
    }


    .logout-btn:hover {
      background: #ffe4eb;
    }


    .hero h1 {
      margin: 0;

      font-size: 44px;

      line-height: 1.2;

      font-weight: 900;

      letter-spacing: 1px;

      color: #334155;
    }


    .hero p {
      margin: 14px 0 0;

      font-size: 18px;

      font-weight: 600;

      color: #6b7d98;
    }


    /* =========================
       六宮格
       ========================= */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 24px;
    }


    .card {
      min-height: 255px;

      border-radius: 28px;

      padding: 32px 24px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      text-decoration: none;

      color: #334155;

      border: 2px solid transparent;

      box-shadow:
        0 10px 26px rgba(80, 70, 120, 0.08);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }


    .card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 16px 35px rgba(80, 70, 120, 0.13);
    }


    .pink {
      background: #fff1f5;
      border-color: #ffc7d6;
    }


    .blue {
      background: #eef7ff;
      border-color: #aee0ff;
    }


    .purple {
      background: #f4f0ff;
      border-color: #d8c8ff;
    }


    .icon {
      font-size: 55px;

      line-height: 1;

      margin-bottom: 28px;
    }


    .card h2 {
      margin: 0;

      font-size: 27px;

      line-height: 1.35;

      font-weight: 900;

      letter-spacing: 0.3px;

      color: #2f3e55;
    }


    .card p {
      margin: 14px 0 0;

      font-size: 16px;

      line-height: 1.5;

      font-weight: 700;

      color: #6b7d98;
    }


    .disabled {
      opacity: 0.72;

      cursor: default;
    }


    .disabled:hover {
      transform: none;

      box-shadow:
        0 10px 26px rgba(80, 70, 120, 0.08);
    }


    /* =========================
       Footer
       ========================= */

    .footer {
      margin-top: 36px;

      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(255, 255, 255, 0.88);

      border:
        1px solid #d6dbe5;

      border-radius: 12px;

      color: #4b5563;

      font-size: 15px;

      font-weight: 600;
    }


    /* =========================
       平板
       ========================= */

    @media (max-width: 1000px) {

      .grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .hero h1 {
        font-size: 38px;
      }

    }


    /* =========================
       手機
       ========================= */

    @media (max-width: 650px) {

      .page {
        padding: 12px;
      }


      .hero {
        min-height: 200px;

        padding:
          74px 18px 26px;

        border-radius: 24px;

        margin-bottom: 18px;
      }


      .account-area {
        top: 14px;
        left: 14px;
        right: 14px;

        justify-content: space-between;
      }


      .account-box {
        max-width: 70%;

        overflow: hidden;

        text-overflow: ellipsis;

        font-size: 12px;
      }


      .logout-btn {
        font-size: 12px;
      }


      .hero h1 {
        font-size: 29px;
      }


      .hero p {
        font-size: 14px;

        line-height: 1.5;
      }


      .grid {
        grid-template-columns: 1fr;

        gap: 15px;
      }


      .card {
        min-height: 180px;

        border-radius: 22px;

        padding: 24px 18px;
      }


      .icon {
        font-size: 45px;

        margin-bottom: 18px;
      }


      .card h2 {
        font-size: 23px;
      }


      .card p {
        margin-top: 9px;

        font-size: 14px;
      }


      .footer {
        margin-top: 20px;

        font-size: 14px;
      }

    }

  </style>
</head>


<body class="auth-checking">

<div class="page">


  <!-- =========================
       標題
       ========================= -->

  <section class="hero">


    <!-- 登入帳號 -->

    <div class="account-area">

      <div class="account-box">
        👤 <span id="userEmail">確認登入中...</span>
      </div>

      <button
        id="logoutButton"
        class="logout-btn"
      >
        🚪 登出
      </button>

    </div>


    <h1>
      🏫 班級經營主控台
    </h1>

    <p>
      點擊下方任一功能大方格，即可快速進入管理系統
    </p>

  </section>



  <!-- =========================
       功能區
       ========================= -->

  <section class="grid">


    <!-- 每日完成紀錄 -->

    <a
      href="contact.html"
      class="card pink"
    >

      <div class="icon">
        📖
      </div>

      <h2>
        每日完成紀錄
      </h2>

      <p>
        801導師專屬
      </p>

    </a>



    <!-- 作業登記 -->

    <a
      href="homework.html"
      class="card blue"
    >

      <div class="icon">
        📚
      </div>

      <h2>
        作業登記專區
      </h2>

      <p>
        各任課班級
      </p>

    </a>



    <!-- 座位表 -->

    <a
      href="seating.html"
      class="card purple"
    >

      <div class="icon">
        🪑
      </div>

      <h2>
        座位表管理
      </h2>

      <p>
        排座位 / 印表
      </p>

    </a>



    <!-- 抽籤 -->

    <a
      href="#"
      class="card blue disabled"
      onclick="return false;"
    >

      <div class="icon">
        🎲
      </div>

      <h2>
        學生抽籤學輪播
      </h2>

      <p>
        課堂互動 / 提問
      </p>

    </a>



    <!-- 倒數 -->

    <a
      href="#"
      class="card pink disabled"
      onclick="return false;"
    >

      <div class="icon">
        ⏳
      </div>

      <h2>
        考試倒數計時器
      </h2>

      <p>
        段考 / 倒數提醒
      </p>

    </a>



    <!-- 預留 -->

    <a
      href="#"
      class="card purple disabled"
      onclick="return false;"
    >

      <div class="icon">
        ➕
      </div>

      <h2>
        新增功能預留區
      </h2>

      <p>
        點擊可擴充
      </p>

    </a>


  </section>


  <div class="footer">
    🔒 班級管理系統
  </div>


</div>


<script type="module">

  import {
    auth
  } from "./firebase-config.js";


  import {
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


  const userEmail =
    document.getElementById(
      "userEmail"
    );


  const logoutButton =
    document.getElementById(
      "logoutButton"
    );


  /*
    檢查是否登入
  */

  onAuthStateChanged(
    auth,

    user => {

      if (!user) {

        window.location.replace(
          "login.html"
        );

        return;
      }


      userEmail.textContent =
        user.email || "已登入";


      document.body.classList.remove(
        "auth-checking"
      );

    }
  );


  /*
    登出
  */

  logoutButton.addEventListener(
    "click",

    async () => {

      const confirmed =
        confirm(
          "確定要登出班級管理系統嗎？"
        );


      if (!confirmed) {
        return;
      }


      try {

        await signOut(auth);


        window.location.replace(
          "login.html"
        );

      }

      catch (error) {

        console.error(error);


        alert(
          "登出失敗，請重新整理後再試一次。"
        );

      }

    }
  );

</script>


</body>
</html>
