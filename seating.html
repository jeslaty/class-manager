<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>801 班級座位表</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background: #f8fafc;
      color: #1e293b;
    }

    body.auth-checking {
      visibility: hidden;
    }

    button {
      font: inherit;
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }

    .title-group p {
      margin: 6px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .account-box {
      border: 1px solid #d8dee9;
      background: white;
      border-radius: 10px;
      padding: 8px 12px;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
    }

    .sync-box {
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      border-radius: 10px;
      padding: 7px 11px;
      color: #15803d;
      font-size: 12px;
      font-weight: 800;
    }

    .sync-box.syncing {
      border-color: #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .sync-box.error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #b91c1c;
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .back-btn {
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .logout-btn {
      border: 1px solid #ffc7d6;
      background: #fff1f5;
      color: #be123c;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
    }

    .container {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;

      box-shadow:
        0 4px 12px rgba(15, 23, 42, 0.05);
    }

    .left-panel {
      padding: 16px;
      position: sticky;
      top: 20px;
    }

    .right-panel {
      padding: 16px;
    }

    .panel-title {
      font-weight: 800;
      color: #334155;
      margin-bottom: 12px;
      font-size: 17px;
    }

    .student-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .student-card {
      background: #f0f9ff;
      border: 1.5px solid #bae6fd;
      border-radius: 10px;
      padding: 9px 10px;
      cursor: grab;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-weight: 700;
      font-size: 14px;
      color: #0369a1;

      user-select: none;
    }

    .student-card:hover {
      background: #e0f2fe;
      border-color: #0284c7;
    }

    .all-assigned {
      grid-column: 1 / -1;

      text-align: center;
      color: #15803d;
      font-weight: 800;

      padding: 20px 5px;

      background: #f0fdf4;

      border-radius: 10px;
      border: 1px solid #bbf7d0;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    button.action {
      cursor: pointer;

      padding: 9px 14px;

      border-radius: 9px;
      border: none;

      font-weight: 800;
      font-size: 14px;

      transition: 0.2s ease;
    }

    button.action:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-success {
      background: #10b981;
      color: white;
    }

    .btn-success:hover {
      background: #059669;
    }

    .btn-secondary {
      background: #64748b;
      color: white;
    }

    .btn-save {
      background: #7c3aed;
      color: white;
    }

    .btn-save:hover {
      background: #6d28d9;
    }

    .status-box {
      margin-bottom: 14px;
      padding: 10px 12px;

      border-radius: 10px;

      background: #f8fafc;

      border: 1px solid #e2e8f0;

      color: #475569;

      font-size: 13px;

      display: none;
    }

    .status-box.show {
      display: block;
    }

    .cadre-section {
      background: #f8fafc;

      border: 1px solid #e2e8f0;

      border-radius: 12px;

      padding: 12px;

      margin-bottom: 14px;
    }

    .cadre-title-head {
      font-weight: 800;
      color: #334155;
      font-size: 15px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      cursor: pointer;
      user-select: none;

      gap: 12px;
    }

    .cadre-grid-top {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .cadre-card-top {
      background: white;

      border: 1px solid #e2e8f0;
      border-left: 3px solid #0284c7;

      border-radius: 6px;

      padding: 5px 6px;

      font-size: 12px;
    }

    .cadre-role {
      color: #64748b;
      font-weight: 600;
      font-size: 11px;
    }

    .cadre-name {
      color: #0f172a;
      font-weight: 700;
      margin-top: 2px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .col-header {
      text-align: center;

      background: #e0f2fe;

      color: #0284c7;

      font-weight: 800;

      padding: 7px;

      border-radius: 8px;

      font-size: 14px;
    }

    .seat-box {
      background: #f8fafc;

      border: 2px dashed #cbd5e1;

      border-radius: 12px;

      min-height: 78px;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      transition: 0.2s ease;

      text-align: center;

      padding: 5px;
    }

    .seat-box.drag-over {
      background: #e0f2fe;
      border-color: #0284c7;
      transform: scale(1.02);
    }

    .seat-occupied {
      background: white;

      border: 2px solid #38bdf8;

      box-shadow:
        0 2px 4px rgba(15, 23, 42, 0.04);

      cursor: grab;
    }

    .seat-id {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
    }

    .seat-name {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      margin-top: 2px;
    }

    .walkway {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
    }

    .podium {
      background: #334155;
      color: white;

      text-align: center;

      padding: 9px;

      border-radius: 10px;

      font-weight: 800;

      margin: 10px 0;

      font-size: 14px;

      letter-spacing: 1px;
    }

    .tip {
      margin-top: 14px;

      font-size: 12px;
      line-height: 1.6;

      color: #64748b;
    }

    @media (max-width: 1100px) {

      .container {
        grid-template-columns: 250px 1fr;
      }

      .cadre-grid-top {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 800px) {

      .container {
        grid-template-columns: 1fr;
      }

      .left-panel {
        position: static;
      }

      .student-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .cadre-grid-top {
        grid-template-columns: repeat(2, 1fr);
      }

      .seat-box {
        min-height: 65px;
      }

      .seat-name {
        font-size: 13px;
      }

      .seat-id {
        font-size: 10px;
      }

      .col-header {
        font-size: 11px;
        padding: 5px;
      }
    }

    @media (max-width: 650px) {

      .page {
        padding: 12px;
      }

      .topbar {
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
        align-items: stretch;
      }

      .account-box,
      .sync-box {
        text-align: center;
      }

      .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .title-group h1 {
        font-size: 25px;
      }

      .student-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .right-panel {
        overflow-x: auto;
      }

      .grid-container,
      .podium,
      .cadre-section,
      .btn-group,
      .status-box {
        min-width: 720px;
      }
    }

    @media print {

      .left-panel,
      .btn-group,
      .top-actions,
      .status-box,
      .title-group p {
        display: none !important;
      }

      .page {
        max-width: none;
        padding: 0;
      }

      .container {
        display: block;
      }

      .right-panel {
        width: 100% !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }

      body {
        background: white;
      }

      .cadre-section {
        border: 1px solid #000;
        background: white;
      }

      .cadre-grid-top {
        display: grid !important;
      }

      .cadre-card-top {
        border: 1px solid #ccc;
        border-left: 3px solid #000;
      }

      .seat-box {
        border: 1.5px solid #000;
        min-height: 80px;
      }

      .col-header {
        border: 1.5px solid #000;

        background: #eee !important;
        color: #000;
      }

      .podium {
        border: 1.5px solid #000;

        background: #ddd !important;
        color: #000;
      }

      .topbar {
        margin-bottom: 10px;
      }
    }
  </style>
</head>

<body class="auth-checking">

<div class="page">

  <div class="topbar">

    <div class="title-group">

      <h1>
        🪑 801 班級座位表
      </h1>

      <p>
        拖曳排位・隨機安排・雲端儲存・列印
      </p>

    </div>

    <div class="top-actions">

      <div class="account-box">
        👤
        <span id="userEmail">
          確認登入中...
        </span>
      </div>

      <div
        id="syncBox"
        class="sync-box syncing"
      >
        ☁️ 連線中...
      </div>

      <div class="action-row">

        <button
          id="backButton"
          class="back-btn"
        >
          🏠 返回主控台
        </button>

        <button
          id="logoutButton"
          class="logout-btn"
        >
          🚪 登出
        </button>

      </div>

    </div>

  </div>


  <div class="container">

    <aside class="panel left-panel">

      <div class="panel-title">
        🎒 待安排學生
      </div>

      <div
        id="studentPool"
        class="student-grid"
      ></div>

      <div class="tip">
        可直接將學生拖曳到右側座位。<br>
        已入座學生也可以再次拖曳更換位置。<br><br>
        排完後請按「💾 儲存目前座位」，才會同步到雲端。
      </div>

    </aside>


    <main class="panel right-panel">

      <div class="btn-group">

        <button
          id="randomButton"
          class="action btn-primary"
        >
          🎲 一鍵隨機排位
        </button>

        <button
          id="resetButton"
          class="action btn-danger"
        >
          🗑️ 清空重置座位
        </button>

        <button
          id="saveButton"
          class="action btn-save"
        >
          💾 儲存目前座位
        </button>

        <button
          id="loadButton"
          class="action btn-secondary"
        >
          ☁️ 載入雲端座位
        </button>

        <button
          id="printButton"
          class="action btn-success"
        >
          🖨️ 列印座位表
        </button>

        <button
          id="viewButton"
          class="action btn-secondary"
        >
          🔄 切換為學生視角
        </button>

      </div>


      <div
        id="statusBox"
        class="status-box"
      ></div>


      <div class="cadre-section">

        <div
          id="cadreHeader"
          class="cadre-title-head"
        >

          <span>
            🎖️ 801 班級幹部與小老師一覽
          </span>

          <span id="toggleIcon">
            🔽 點擊展開
          </span>

        </div>

        <div
          class="cadre-grid-top"
          id="cadreTopGrid"
          style="display:none;"
        ></div>

      </div>


      <div
        id="topPodium"
        class="podium"
        style="display:none;"
      >
        📺 黑板 / 教師講台區
        （學生視角：面向講台）
      </div>


      <div
        class="grid-container"
        id="gridHeader"
      ></div>


      <div
        class="grid-container"
        id="gridSeats"
      ></div>


      <div
        id="bottomPodium"
        class="podium"
      >
        📺 黑板 / 教師講台區
        （老師講台視角：站在講台面對學生）
      </div>

    </main>

  </div>

</div>

  function seatingDocRef() {

    return doc(
      db,
      "classes",
      "801",
      "seating",
      "current"
    );
  }


  function setSyncStatus(
    type,
    text
  ) {

    syncBox.className =
      "sync-box";


    if (
      type === "syncing"
    ) {
      syncBox.classList.add(
        "syncing"
      );
    }


    if (
      type === "error"
    ) {
      syncBox.classList.add(
        "error"
      );
    }


    syncBox.textContent =
      text;
  }


  function showStatus(
    message
  ) {

    statusBox.textContent =
      message;

    statusBox.classList.add(
      "show"
    );


    setTimeout(
      () => {

        statusBox.classList.remove(
          "show"
        );

      },
      3000
    );
  }


  function renderCadres() {

    cadreTopGrid.innerHTML =
      cadresData
        .map(
          cadre => `
            <div class="cadre-card-top">

              <div class="cadre-role">
                ${cadre.cadre}
              </div>

              <div class="cadre-name">
                ${cadre.id}號
                ${cadre.name}
              </div>

            </div>
          `
        )
        .join("");
  }


  function toggleCadres() {

    if (
      cadreTopGrid.style.display ===
      "none"
    ) {

      cadreTopGrid.style.display =
        "grid";

      toggleIcon.textContent =
        "🔼 點擊收合";

    } else {

      cadreTopGrid.style.display =
        "none";

      toggleIcon.textContent =
        "🔽 點擊展開";
    }
  }


  function renderStudentPool() {

    studentPool.innerHTML =
      "";


    const assignedIds =
      new Set(
        Object.values(
          seatsMap
        ).map(Number)
      );


    const unassigned =
      studentsData.filter(
        student =>
          !assignedIds.has(
            student.id
          )
      );


    if (
      unassigned.length ===
      0
    ) {

      studentPool.innerHTML = `
        <div class="all-assigned">
          🎉 全班同學皆已指派入座
        </div>
      `;

      return;
    }


    unassigned.forEach(
      student => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "student-card";

        card.draggable =
          true;


        card.innerHTML = `
          <span>
            ${student.id}號
            ${student.name}
          </span>

          <span style="opacity:.4;">
            ⋮⋮
          </span>
        `;


        card.addEventListener(
          "dragstart",
          event => {

            event.dataTransfer
              .setData(
                "text/plain",
                String(
                  student.id
                )
              );
          }
        );


        studentPool.appendChild(
          card
        );
      }
    );
  }


  function renderGrid() {

    gridHeader.innerHTML =
      "";

    gridSeats.innerHTML =
      "";


    for (
      let c = 0;
      c < 6;
      c++
    ) {

      const colNum =
        isTeacherView
          ? c + 1
          : 6 - c;


      const header =
        document.createElement(
          "div"
        );

      header.className =
        "col-header";

      header.textContent =
        `第 ${colNum} 列`;


      gridHeader.appendChild(
        header
      );
    }


    const rowOrder =
      isTeacherView
        ? [4, 3, 2, 1, 0]
        : [0, 1, 2, 3, 4];


    rowOrder.forEach(
      row => {

        for (
          let column = 0;
          column < 6;
          column++
        ) {

          const realColumn =
            isTeacherView
              ? column
              : 5 - column;


          const box =
            document.createElement(
              "div"
            );


          if (
            realColumn === 5 &&
            row >= 3
          ) {

            box.className =
              "seat-box walkway";

            box.innerHTML =
              "🚫 走道";


            gridSeats.appendChild(
              box
            );

            continue;
          }


          const positionKey =
            `${row}_${realColumn}`;


          const studentId =
            Number(
              seatsMap[
                positionKey
              ]
            );


          if (
            studentId
          ) {

            const student =
              studentsData.find(
                item =>
                  item.id ===
                  studentId
              );


            if (student) {

              box.className =
                "seat-box seat-occupied";

              box.draggable =
                true;


              box.innerHTML = `
                <div class="seat-id">
                  ${student.id} 號
                </div>

                <div class="seat-name">
                  ${student.name}
                </div>
              `;


              box.addEventListener(
                "dragstart",
                event => {

                  event.dataTransfer
                    .setData(
                      "text/plain",
                      String(
                        student.id
                      )
                    );
                }
              );
            }

          } else {

            box.className =
              "seat-box";


            box.innerHTML = `
              <div class="seat-id">
                第 ${row + 1} 排
              </div>

              <div
                style="
                  color:#cbd5e1;
                  font-weight:600;
                "
              >
                空位
              </div>
            `;
          }


          box.addEventListener(
            "dragover",
            event => {

              event.preventDefault();

              box.classList.add(
                "drag-over"
              );
            }
          );


          box.addEventListener(
            "dragleave",
            () => {

              box.classList.remove(
                "drag-over"
              );
            }
          );


          box.addEventListener(
            "drop",
            event => {

              event.preventDefault();

              box.classList.remove(
                "drag-over"
              );


              const droppedId =
                Number(
                  event.dataTransfer
                    .getData(
                      "text/plain"
                    )
                );


              if (
                !droppedId
              ) {
                return;
              }


              let oldPosition =
                null;


              Object.keys(
                seatsMap
              ).forEach(
                key => {

                  if (
                    Number(
                      seatsMap[key]
                    ) ===
                    droppedId
                  ) {

                    oldPosition =
                      key;
                  }
                }
              );


              const existingId =
                Number(
                  seatsMap[
                    positionKey
                  ]
                );


              if (
                oldPosition &&
                existingId &&
                existingId !==
                  droppedId
              ) {

                seatsMap[
                  oldPosition
                ] =
                  existingId;

              } else if (
                oldPosition
              ) {

                delete seatsMap[
                  oldPosition
                ];
              }


              seatsMap[
                positionKey
              ] =
                droppedId;


              renderGrid();
              renderStudentPool();


              showStatus(
                "✏️ 座位已調整，請記得按「儲存目前座位」。"
              );
            }
          );


          gridSeats.appendChild(
            box
          );
        }
      }
    );
  }


  function toggleView() {

    isTeacherView =
      !isTeacherView;


    topPodium.style.display =
      isTeacherView
        ? "none"
        : "block";


    bottomPodium.style.display =
      isTeacherView
        ? "block"
        : "none";


    viewButton.textContent =
      isTeacherView
        ? "🔄 切換為學生視角"
        : "🔄 切換為老師視角";


    renderGrid();
  }


  function autoAssign() {

    seatsMap = {};


    const shuffled =
      [...studentsData]
        .sort(
          () =>
            Math.random() -
            0.5
        );


    let index = 0;


    for (
      let row = 0;
      row < 5;
      row++
    ) {

      for (
        let column = 0;
        column < 6;
        column++
      ) {

        if (
          column === 5 &&
          row >= 3
        ) {
          continue;
        }


        if (
          index <
          shuffled.length
        ) {

          seatsMap[
            `${row}_${column}`
          ] =
            shuffled[index].id;

          index++;
        }
      }
    }


    renderGrid();
    renderStudentPool();


    showStatus(
      "🎲 已完成隨機排位，確認後請按「儲存目前座位」。"
    );
  }


  function resetSeats() {

    const confirmed =
      confirm(
        "確定要清空目前畫面上的所有座位嗎？\n\n清空後仍需按「儲存目前座位」，才會更新雲端資料。"
      );


    if (
      !confirmed
    ) {
      return;
    }


    seatsMap = {};


    renderGrid();
    renderStudentPool();


    showStatus(
      "🗑️ 已清空目前座位，尚未儲存到雲端。"
    );
  }


  async function saveSeats() {

    saveButton.disabled =
      true;


    setSyncStatus(
      "syncing",
      "☁️ 正在儲存座位..."
    );


    try {

      await setDoc(
        seatingDocRef(),
        {
          className:
            "801",

          seatsMap:
            seatsMap,

          updatedAt:
            serverTimestamp(),

          updatedBy:
            currentUser?.email ||
            ""
        },
        {
          merge: true
        }
      );


      setSyncStatus(
        "ok",
        "☁️ 已儲存到雲端"
      );


      showStatus(
        "💾 801 座位表已成功儲存到雲端。"
      );

    } catch (error) {

      console.error(
        error
      );


      setSyncStatus(
        "error",
        "⚠️ 雲端儲存失敗"
      );


      alert(
        "座位表沒有成功存到雲端，請確認網路連線後再試。"
      );

    } finally {

      saveButton.disabled =
        false;
    }
  }


  async function loadSeats(
    showMessage = true
  ) {

    loadButton.disabled =
      true;


    setSyncStatus(
      "syncing",
      "☁️ 正在讀取座位..."
    );


    try {

      const snapshot =
        await getDoc(
          seatingDocRef()
        );


      if (
        snapshot.exists()
      ) {

        const data =
          snapshot.data();


        seatsMap =
          data.seatsMap ||
          {};


        renderGrid();
        renderStudentPool();


        setSyncStatus(
          "ok",
          "☁️ 雲端資料已同步"
        );


        if (
          showMessage
        ) {

          showStatus(
            "☁️ 已載入最新雲端座位表。"
          );
        }

      } else {

        seatsMap = {};


        renderGrid();
        renderStudentPool();


        setSyncStatus(
          "ok",
          "☁️ 尚無雲端座位資料"
        );


        if (
          showMessage
        ) {

          showStatus(
            "目前 Firestore 尚未儲存座位表。"
          );
        }
      }

    } catch (error) {

      console.error(
        error
      );


      setSyncStatus(
        "error",
        "⚠️ 雲端讀取失敗"
      );


      if (
        showMessage
      ) {

        alert(
          "座位表讀取失敗，請確認網路連線後再試。"
        );
      }

    } finally {

      loadButton.disabled =
        false;
    }
  }


  async function migrateLocalStorage() {

    const localRaw =
      localStorage.getItem(
        OLD_LOCAL_STORAGE_KEY
      );


    if (
      !localRaw
    ) {
      return;
    }


    try {

      const remote =
        await getDoc(
          seatingDocRef()
        );


      if (
        remote.exists()
      ) {

        return;
      }


      const localSeats =
        JSON.parse(
          localRaw
        );


      if (
        !localSeats ||
        typeof localSeats !==
          "object"
      ) {
        return;
      }


      setSyncStatus(
        "syncing",
        "☁️ 正在搬移舊座位資料..."
      );


      await setDoc(
        seatingDocRef(),
        {
          className:
            "801",

          seatsMap:
            localSeats,

          migratedFromLocalStorage:
            true,

          updatedAt:
            serverTimestamp(),

          updatedBy:
            currentUser?.email ||
            ""
        }
      );


      setSyncStatus(
        "ok",
        "☁️ 舊座位已搬到雲端"
      );

    } catch (error) {

      console.error(
        "座位資料搬移失敗：",
        error
      );
    }
  }


  document
    .getElementById(
      "backButton"
    )
    .addEventListener(
      "click",
      () => {

        window.location.href =
          "index.html";
      }
    );


  document
    .getElementById(
      "randomButton"
    )
    .addEventListener(
      "click",
      autoAssign
    );


  document
    .getElementById(
      "resetButton"
    )
    .addEventListener(
      "click",
      resetSeats
    );


  saveButton
    .addEventListener(
      "click",
      saveSeats
    );


  loadButton
    .addEventListener(
      "click",
      async () => {

        await loadSeats(
          true
        );
      }
    );


  document
    .getElementById(
      "printButton"
    )
    .addEventListener(
      "click",
      () => {

        window.print();
      }
    );


  viewButton
    .addEventListener(
      "click",
      toggleView
    );


  document
    .getElementById(
      "cadreHeader"
    )
    .addEventListener(
      "click",
      toggleCadres
    );


  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        const confirmed =
          confirm(
            "確定要登出班級管理系統嗎？"
          );


        if (
          !confirmed
        ) {
          return;
        }


        try {

          await signOut(
            auth
          );


          window.location.replace(
            "login.html"
          );

        } catch (error) {

          console.error(
            error
          );


          alert(
            "登出失敗，請重新整理後再試。"
          );
        }
      }
    );


  renderCadres();


  await authReady;


  onAuthStateChanged(
    auth,

    async user => {

      if (
        !user
      ) {

        window.location.replace(
          "login.html"
        );

        return;
      }


      currentUser =
        user;


      userEmail.textContent =
        user.email ||
        "已登入";


      document.body
        .classList
        .remove(
          "auth-checking"
        );


      await migrateLocalStorage();


      await loadSeats(
        false
      );
    }
  );

</script>
