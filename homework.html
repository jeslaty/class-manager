<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>作業登記專區</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background: #f8fafc;
      color: #1e293b;
    }

    body.auth-checking {
      visibility: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }

    .title-group p {
      margin: 6px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .account-box {
      border: 1px solid #d8dee9;
      background: white;
      border-radius: 10px;
      padding: 8px 12px;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
    }

    .sync-box {
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      border-radius: 10px;
      padding: 7px 11px;
      color: #15803d;
      font-size: 12px;
      font-weight: 800;
    }

    .sync-box.syncing {
      border-color: #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .sync-box.error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #b91c1c;
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .back-btn {
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .logout-btn {
      border: 1px solid #ffc7d6;
      background: #fff1f5;
      color: #be123c;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }

    .left-panel {
      padding: 18px;
      position: sticky;
      top: 20px;
    }

    .right-panel {
      padding: 18px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .control {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: white;
      color: #1e293b;
      padding: 11px 12px;
      margin-bottom: 12px;
      min-height: 46px;
    }

    select.control {
      cursor: pointer;
      appearance: auto;
      -webkit-appearance: menulist;
    }

    select.control option {
      color: #1e293b;
      background: white;
    }

    .add-row {
      display: grid;
      gap: 8px;
    }

    .primary-btn {
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-weight: 800;
      padding: 11px 12px;
      cursor: pointer;
    }

    .primary-btn:hover {
      background: #4338ca;
    }

    .primary-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 18px 0;
    }

    .homework-list {
      display: grid;
      gap: 8px;
    }

    .homework-btn {
      width: 100%;
      text-align: left;
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      color: #475569;
      font-weight: 700;
    }

    .homework-btn.active {
      background: #eef2ff;
      border-color: #818cf8;
      color: #3730a3;
    }

    .homework-btn.completed {
      opacity: 0.6;
    }

    .unfinished-box {
      margin-top: 18px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 14px;
    }

    .unfinished-title {
      font-weight: 800;
      color: #b91c1c;
      margin-bottom: 8px;
    }

    .unfinished-list {
      color: #7f1d1d;
      font-size: 14px;
      line-height: 1.7;
    }

    .class-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .class-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .class-tag {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      color: white;
      font-size: 13px;
      font-weight: 800;
    }

    .tag-801 {
      background: #3b82f6;
    }

    .tag-teaching {
      background: #10b981;
    }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-card {
      border-radius: 12px;
      padding: 13px;
      text-align: center;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    .summary-card strong {
      display: block;
      font-size: 24px;
      margin-top: 4px;
    }

    .option-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-btn {
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      font-weight: 700;
      color: #475569;
    }

    .filter-btn.active {
      background: #e0f2fe;
      border-color: #38bdf8;
      color: #0369a1;
    }

    .student-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .student-card {
      border: 1px solid #dbeafe;
      border-radius: 14px;
      padding: 14px;
      background: white;
    }

    .student-card.unpaid {
      border-color: #fca5a5;
      background: #fffafa;
    }

    .student-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .status-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .status-btn {
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 9px 6px;
      cursor: pointer;
      font-weight: 800;
      background: #f8fafc;
      color: #64748b;
    }

    .status-btn.paid.active {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }

    .status-btn.unpaid.active {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #991b1b;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: #64748b;
    }

    @media (max-width: 1000px) {
      .student-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .layout {
        grid-template-columns: 280px 1fr;
      }
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .left-panel {
        position: static;
      }
    }

    @media (max-width: 650px) {
      .page {
        padding: 12px;
      }

      .topbar {
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
        align-items: stretch;
      }

      .account-box,
      .sync-box {
        text-align: center;
      }

      .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .title-group h1 {
        font-size: 25px;
      }

      .student-grid {
        grid-template-columns: 1fr;
      }

      .summary-row {
        grid-template-columns: repeat(3, 1fr);
      }

      .summary-card {
        padding: 10px 5px;
        font-size: 13px;
      }

      .summary-card strong {
        font-size: 20px;
      }
    }
  </style>
</head>

    <main class="panel right-panel">

          已繳

        <div class="summary-card">
          未繳

        </div>

        <div class="summary-card">
          總人數

        </div>

      </div>

      <div class="option-row">

        <button
          class="filter-btn active"
          data-filter="all"
        >
          👥 全部
        </button>

        <button
          class="filter-btn"
          data-filter="unpaid"
        >

        </button>

        <button
          class="filter-btn"
          data-filter="paid"
        >
          ✅ 只看已繳
        </button>

      </div>

      <div
        id="studentGrid"
        class="student-grid"
      ></div>

    </main>

  </div>

</div>

  function setSyncStatus(type, text) {

    syncBox.className =
      "sync-box";

    if (type === "syncing") {
      syncBox.classList.add(
        "syncing"
      );
    }

    if (type === "error") {
      syncBox.classList.add(
        "error"
      );
    }

    syncBox.textContent =
      text;
  }


  function getClassCode(
    className
  ) {
    return className.replace(
      "班",
      ""
    );
  }


  function homeworkCollectionRef(
    className
  ) {
    return collection(
      db,
      "classes",
      getClassCode(className),
      "homeworks"
    );
  }


  function homeworkDocRef(
    className,
    homeworkId
  ) {
    return doc(
      db,
      "classes",
      getClassCode(className),
      "homeworks",
      homeworkId
    );
  }


  function getStudents() {

    return CLASSES[currentClass]
      .map(
        ([id, name]) => ({
          id,
          name
        })
      );
  }


  function createEmptySubmissions(
    className
  ) {

    const submissions = {};

    CLASSES[className]
      .forEach(
        ([id]) => {
          submissions[id] = false;
        }
      );

    return submissions;
  }


  function normalizeSubmissions(
    homework
  ) {

    const students =
      getStudents();

    if (!homework.submissions) {
      homework.submissions = {};
    }

    students.forEach(student => {

      if (
        typeof homework.submissions[
          student.id
        ] !== "boolean"
      ) {
        homework.submissions[
          student.id
        ] = false;
      }
    });

    return homework;
  }


  async function loadClassData(
    className
  ) {

    setSyncStatus(
      "syncing",
      `☁️ 正在讀取 ${className}...`
    );

    try {

      const snapshot =
        await getDocs(
          homeworkCollectionRef(
            className
          )
        );

      homeworksCache = [];

      snapshot.forEach(
        docSnap => {

          const data =
            docSnap.data();

          homeworksCache.push({
            id: docSnap.id,
            title:
              data.title ||
              "未命名作業",
            submissions:
              data.submissions ||
              {},
            createdAtMs:
              data.createdAtMs ||
              Number(docSnap.id) ||
              0
          });
        }
      );


      homeworksCache.sort(
        (a, b) =>
          a.createdAtMs -
          b.createdAtMs
      );


      homeworksCache.forEach(
        homework => {
          normalizeSubmissions(
            homework
          );
        }
      );


      if (
        currentHomeworkId &&
        !homeworksCache.some(
          homework =>
            homework.id ===
            currentHomeworkId
        )
      ) {
        currentHomeworkId =
          null;
      }


      setSyncStatus(
        "ok",
        "☁️ 雲端資料已同步"
      );

      renderAll();

    } catch (error) {

      console.error(error);

      homeworksCache = [];

      setSyncStatus(
        "error",
        "⚠️ 雲端讀取失敗"
      );

      renderAll();

      alert(
        `${className} 作業資料讀取失敗，請確認網路連線後再試。`
      );
    }
  }


  async function addHomework() {

    const title =
      newHomeworkInput
        .value
        .trim();

    if (!title) {

      alert(
        "請輸入作業名稱。"
      );

      return;
    }


    const duplicated =
      homeworksCache.some(
        homework =>
          homework.title ===
          title
      );

    if (duplicated) {

      alert(
        "這個作業名稱已經存在。"
      );

      return;
    }


    addHomeworkButton.disabled =
      true;

    setSyncStatus(
      "syncing",
      "☁️ 正在建立作業..."
    );


    const createdAtMs =
      Date.now();

    const homeworkId =
      createdAtMs.toString();

    const newHomework = {
      id: homeworkId,
      title,
      submissions:
        createEmptySubmissions(
          currentClass
        ),
      createdAtMs
    };


    try {

      await setDoc(
        homeworkDocRef(
          currentClass,
          homeworkId
        ),
        {
          title:
            newHomework.title,

          submissions:
            newHomework.submissions,

          createdAtMs:
            newHomework.createdAtMs,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp(),

          updatedBy:
            currentUser?.email ||
            ""
        }
      );


      homeworksCache.push(
        newHomework
      );

      homeworksCache.sort(
        (a, b) =>
          a.createdAtMs -
          b.createdAtMs
      );


      currentHomeworkId =
        homeworkId;

      newHomeworkInput.value =
        "";

      setSyncStatus(
        "ok",
        "☁️ 已儲存到雲端"
      );

      renderAll();

    } catch (error) {

      console.error(error);

      setSyncStatus(
        "error",
        "⚠️ 建立作業失敗"
      );

      alert(
        "作業沒有成功建立，請確認網路連線後再試。"
      );

    } finally {

      addHomeworkButton.disabled =
        false;
    }
  }


  async function setSubmission(
    studentId,
    paid
  ) {

    const homework =
      homeworksCache.find(
        hw =>
          hw.id ===
          currentHomeworkId
      );

    if (!homework) {
      return;
    }


    const oldValue =
      homework.submissions[
        studentId
      ] === true;


    homework.submissions[
      studentId
    ] = paid;


    renderRightPanel();
    renderHomeworkList();


    setSyncStatus(
      "syncing",
      "☁️ 正在儲存..."
    );


    try {

      await setDoc(
        homeworkDocRef(
          currentClass,
          homework.id
        ),
        {
          title:
            homework.title,

          submissions:
            homework.submissions,

          createdAtMs:
            homework.createdAtMs,

          updatedAt:
            serverTimestamp(),

          updatedBy:
            currentUser?.email ||
            ""
        },
        {
          merge: true
        }
      );


      setSyncStatus(
        "ok",
        "☁️ 已儲存到雲端"
      );

    } catch (error) {

      console.error(error);


      homework.submissions[
        studentId
      ] = oldValue;


      renderRightPanel();
      renderHomeworkList();


      setSyncStatus(
        "error",
        "⚠️ 儲存失敗"
      );


      alert(
        "繳交狀態沒有成功存到雲端，請確認網路連線後再試。"
      );
    }
  }


  function homeworkCompleted(
    homework
  ) {

    const students =
      getStudents();

    return students.every(
      student =>
        homework.submissions[
          student.id
        ] === true
    );
  }


  function getCurrentHomework() {

    const existing =
      homeworksCache.find(
        homework =>
          homework.id ===
          currentHomeworkId
      );

    if (existing) {
      return existing;
    }


    const unfinished =
      homeworksCache.find(
        homework =>
          !homeworkCompleted(
            homework
          )
      );


    const fallback =
      unfinished ||
      homeworksCache[0];


    if (fallback) {

      currentHomeworkId =
        fallback.id;

      return fallback;
    }


    currentHomeworkId =
      null;

    return null;
  }


  function renderHomeworkList() {

    homeworkList.innerHTML =
      "";


    if (
      homeworksCache.length ===
      0
    ) {

      homeworkList.innerHTML = `
        <div
          style="
            color:#64748b;
            font-size:14px;
          "
        >
          目前尚無作業項目。
        </div>
      `;

      return;
    }


    const active = [];
    const completed = [];


    homeworksCache.forEach(
      homework => {

        if (
          homeworkCompleted(
            homework
          )
        ) {

          completed.push(
            homework
          );

        } else {

          active.push(
            homework
          );
        }
      }
    );


    const ordered = [
      ...active,
      ...completed
    ];


    ordered.forEach(
      homework => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "homework-btn";


        if (
          homework.id ===
          currentHomeworkId
        ) {

          button.classList.add(
            "active"
          );
        }


        if (
          homeworkCompleted(
            homework
          )
        ) {

          button.classList.add(
            "completed"
          );
        }


        button.textContent =
          `${
            homeworkCompleted(
              homework
            )
              ? "✅"
              : "📘"
          } ${homework.title}`;


        button.addEventListener(
          "click",
          () => {

            currentHomeworkId =
              homework.id;

            renderAll();
          }
        );


        homeworkList.appendChild(
          button
        );
      }
    );
  }


  function renderRightPanel() {

    const students =
      getStudents();

    const homework =
      getCurrentHomework();


    classTitle.textContent =
      `📋 ${currentClass} 作業登記`;


    if (
      currentClass ===
      "801班"
    ) {

      classTag.textContent =
        "👑 導師班級";

      classTag.className =
        "class-tag tag-801";

    } else {

      classTag.textContent =
        "📖 任教英文班級";

      classTag.className =
        "class-tag tag-teaching";
    }


    if (!homework) {

      homeworkTitle.textContent =
        "請先新增作業項目";

      paidCount.textContent =
        "0";

      unpaidCount.textContent =
        "0";

      totalCount.textContent =
        students.length;

      unfinishedList.textContent =
        "請先新增或選擇作業。";

      studentGrid.innerHTML = `
        <div class="empty-state">
          目前尚未建立作業項目。
        </div>
      `;

      return;
    }


    homeworkTitle.textContent =
      `目前作業：${homework.title}`;


    let paidNumber = 0;

    const unpaidStudents = [];

    studentGrid.innerHTML = "";


    students.forEach(
      student => {

        const paid =
          homework.submissions[
            student.id
          ] === true;


        if (paid) {

          paidNumber++;

        } else {

          unpaidStudents.push(
            student
          );
        }


        if (
          currentFilter ===
            "unpaid" &&
          paid
        ) {
          return;
        }


        if (
          currentFilter ===
            "paid" &&
          !paid
        ) {
          return;
        }


        const card =
          document.createElement(
            "div"
          );

        card.className =
          "student-card" +
          (
            paid
              ? ""
              : " unpaid"
          );


        card.innerHTML = `
          <div class="student-name">
            ${student.id}號
            ${student.name}
          </div>

          <div class="status-buttons">

            <button
              class="status-btn paid ${
                paid
                  ? "active"
                  : ""
              }"
              data-student-id="${student.id}"
              data-paid="true"
            >
              ✅ 已繳
            </button>

            <button
              class="status-btn unpaid ${
                !paid
                  ? "active"
                  : ""
              }"
              data-student-id="${student.id}"
              data-paid="false"
            >
              ❌ 未繳
            </button>

          </div>
        `;


        studentGrid.appendChild(
          card
        );
      }
    );


    studentGrid
      .querySelectorAll(
        "[data-student-id]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            async () => {

              const studentId =
                Number(
                  button.dataset
                    .studentId
                );

              const paid =
                button.dataset
                  .paid ===
                "true";


              await setSubmission(
                studentId,
                paid
              );
            }
          );
        }
      );


    paidCount.textContent =
      paidNumber;

    unpaidCount.textContent =
      students.length -
      paidNumber;

    totalCount.textContent =
      students.length;


    if (
      unpaidStudents.length ===
      0
    ) {

      unfinishedList.innerHTML =
        "🎉 全班皆已繳齊！";

    } else {

      unfinishedList.innerHTML =
        unpaidStudents
          .map(
            student =>
              `${student.id}號 ${student.name}`
          )
          .join("<br>");
    }
  }


  function renderAll() {

    getCurrentHomework();

    renderHomeworkList();

    renderRightPanel();
  }


  async function migrateClassLocalStorage(
    className
  ) {

    const key =
      `homework-data-${className}`;

    const raw =
      localStorage.getItem(
        key
      );

    if (!raw) {
      return;
    }


    let localData;

    try {

      localData =
        JSON.parse(raw);

    } catch (error) {

      console.error(
        "舊作業資料解析失敗：",
        error
      );

      return;
    }


    if (
      !localData ||
      !Array.isArray(
        localData.homeworks
      ) ||
      localData.homeworks.length ===
        0
    ) {
      return;
    }


    for (
      let index = 0;
      index <
      localData.homeworks.length;
      index++
    ) {

      const homework =
        localData.homeworks[
          index
        ];

      if (
        !homework ||
        !homework.title
      ) {
        continue;
      }


      const homeworkId =
        String(
          homework.id ||
          (
            Date.now() +
            index
          )
        );


      try {

        const ref =
          homeworkDocRef(
            className,
            homeworkId
          );

        const remote =
          await getDoc(ref);


        if (
          remote.exists()
        ) {
          continue;
        }


        const createdAtMs =
          Number(
            homework.id
          ) ||
          (
            Date.now() +
            index
          );


        await setDoc(
          ref,
          {
            title:
              homework.title,

            submissions:
              homework.submissions ||
              createEmptySubmissions(
                className
              ),

            createdAtMs,

            migratedFromLocalStorage:
              true,

            updatedAt:
              serverTimestamp(),

            updatedBy:
              currentUser?.email ||
              ""
          }
        );

      } catch (error) {

        console.error(
          `${className} 舊作業搬移失敗：`,
          error
        );
      }
    }
  }


  async function migrateAllLocalStorage() {

    setSyncStatus(
      "syncing",
      "☁️ 正在檢查舊作業資料..."
    );


    for (
      const className of
      Object.keys(CLASSES)
    ) {

      await migrateClassLocalStorage(
        className
      );
    }


    setSyncStatus(
      "ok",
      "☁️ 雲端資料已同步"
    );
  }


  classSelect.addEventListener(
    "change",
    async function () {

      currentClass =
        this.value;

      currentHomeworkId =
        null;

      currentFilter =
        "all";


      document
        .querySelectorAll(
          ".filter-btn"
        )
        .forEach(
          button =>
            button.classList.remove(
              "active"
            )
        );


      document
        .querySelector(
          '[data-filter="all"]'
        )
        .classList.add(
          "active"
        );


      await loadClassData(
        currentClass
      );
    }
  );


  document
    .querySelectorAll(
      ".filter-btn"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".filter-btn"
              )
              .forEach(
                btn =>
                  btn.classList.remove(
                    "active"
                  )
              );


            button.classList.add(
              "active"
            );


            currentFilter =
              button.dataset.filter;


            renderRightPanel();
          }
        );
      }
    );


  addHomeworkButton
    .addEventListener(
      "click",
      addHomework
    );


  newHomeworkInput
    .addEventListener(
      "keydown",
      async event => {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          await addHomework();
        }
      }
    );


  logoutButton.addEventListener(
    "click",
    async () => {

      const confirmed =
        confirm(
          "確定要登出班級管理系統嗎？"
        );

      if (!confirmed) {
        return;
      }


      try {

        await signOut(auth);

        window.location.replace(
          "login.html"
        );

      } catch (error) {

        console.error(error);

        alert(
          "登出失敗，請重新整理後再試。"
        );
      }
    }
  );


  classSelect.value =
    currentClass;


  await authReady;


  onAuthStateChanged(
    auth,
    async user => {

      if (!user) {

        window.location.replace(
          "login.html"
        );

        return;
      }


      currentUser =
        user;


      userEmail.textContent =
        user.email ||
        "已登入";


      document.body
        .classList
        .remove(
          "auth-checking"
        );


      await migrateAllLocalStorage();


      await loadClassData(
        currentClass
      );
    }
  );

</script>
