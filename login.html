<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>班級經營系統登入</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="app-icon.png">

  <meta name="theme-color" content="#f7f6ff">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff8fb 0%,
          #f7f8ff 50%,
          #f5f1ff 100%
        );

      color: #334155;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;

      background: rgba(255, 255, 255, 0.92);

      border: 1px solid #e2e8f0;
      border-radius: 28px;

      padding: 38px 34px;

      box-shadow:
        0 18px 45px rgba(80, 70, 120, 0.12);
    }

    .icon-box {
      width: 88px;
      height: 88px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 24px;

      background: #f4f0ff;

      font-size: 44px;
    }

    h1 {
      margin: 0;
      text-align: center;

      font-size: 29px;
      font-weight: 900;

      color: #334155;
    }

    .subtitle {
      text-align: center;

      color: #64748b;

      margin: 10px 0 30px;

      font-size: 14px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-weight: 800;

      color: #475569;
    }

    input {
      width: 100%;

      padding: 12px 14px;

      border: 1px solid #cbd5e1;
      border-radius: 11px;

      background: #ffffff;

      font-size: 16px;

      outline: none;
    }

    input:focus {
      border-color: #a78bfa;

      box-shadow:
        0 0 0 3px rgba(167, 139, 250, 0.12);
    }

    .login-btn {
      width: 100%;

      margin-top: 6px;

      padding: 13px;

      border: none;
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #6366f1,
          #8b5cf6
        );

      color: white;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;
    }

    .login-btn:hover {
      opacity: 0.94;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      min-height: 22px;

      margin-top: 16px;

      text-align: center;

      font-size: 14px;
      font-weight: 700;
    }

    .error {
      color: #b91c1c;
    }

    .success {
      color: #15803d;
    }

    .footer-note {
      margin-top: 24px;

      padding-top: 18px;

      border-top: 1px solid #e2e8f0;

      text-align: center;

      color: #94a3b8;

      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 500px) {
      .login-card {
        padding: 30px 22px;
        border-radius: 22px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="icon-box">
      🏫
    </div>

    <h1>
      班級經營系統
    </h1>

    <div class="subtitle">
      請登入後進入管理主控台
    </div>

    <form id="loginForm">

      <div class="field">
        <label for="email">
          電子郵件
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
          placeholder="輸入登入 Email"
        >
      </div>

      <div class="field">
        <label for="password">
          密碼
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="輸入密碼"
        >
      </div>

      <button
        id="loginButton"
        class="login-btn"
        type="submit"
      >
        🔐 登入
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <div class="footer-note">
      此系統僅供授權使用者登入。<br>
      使用公用電腦後，請記得登出。
    </div>

  </div>


  <script type="module">

    import {
      auth
    } from "./firebase-config.js";

    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const form =
      document.getElementById(
        "loginForm"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const button =
      document.getElementById(
        "loginButton"
      );

    const message =
      document.getElementById(
        "message"
      );


    /*
      如果已經登入，
      直接送回主控台。
    */
    onAuthStateChanged(
      auth,
      user => {

        if (user) {
          window.location.href =
            "index.html";
        }
      }
    );


    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        button.disabled = true;

        button.textContent =
          "登入中...";

        message.textContent = "";

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          message.className =
            "message success";

          message.textContent =
            "✅ 登入成功";

          window.location.href =
            "index.html";

        }

        catch (error) {

          console.error(error);

          message.className =
            "message error";

          switch (
            error.code
          ) {

            case "auth/invalid-credential":
            case "auth/wrong-password":
            case "auth/user-not-found":

              message.textContent =
                "帳號或密碼不正確。";

              break;


            case "auth/invalid-email":

              message.textContent =
                "Email 格式不正確。";

              break;


            case "auth/too-many-requests":

              message.textContent =
                "登入嘗試次數過多，請稍後再試。";

              break;


            default:

              message.textContent =
                "登入失敗，請稍後再試。";
          }

          button.disabled = false;

          button.textContent =
            "🔐 登入";
        }
      }
    );

  </script>

</body>
</html>
